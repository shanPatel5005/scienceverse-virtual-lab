<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScienceVerse Virtual Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030609;color:#fff;font-family:system-ui,Arial}.lab{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#dce6e5 0 42%,#7d8786 43% 100%)}.wall{position:absolute;inset:0 0 38% 0;background:linear-gradient(90deg,#eef3f1,#cbd5d2,#eef4f1);border-bottom:5px solid #596462}.wall:before{content:'PHYSICS  •  CHEMISTRY  •  BIOLOGY';position:absolute;left:28%;top:8%;font-size:clamp(18px,3vw,40px);font-weight:800;color:#405055;letter-spacing:.08em}.wall:after{content:'F = ma     V = IR     pH     DNA     λ = h/p';position:absolute;left:31%;top:20%;font-size:clamp(13px,2vw,24px);color:#707d7e;letter-spacing:.12em}.window{position:absolute;right:6%;top:5%;width:22%;height:27%;border:10px solid #aab5b2;background:linear-gradient(130deg,#bfe3ed,#f1fbfd)}.backbench{position:absolute;left:8%;right:8%;top:34%;height:14%;background:linear-gradient(#aab4b1,#5e6967);box-shadow:0 8px 12px #0004}.cab{position:absolute;top:47%;height:14%;background:linear-gradient(#e7ecea,#9ba5a2);border:1px solid #69726f}.a{left:7%;width:25%}.b{left:34%;width:22%}.c{right:7%;width:33%}.floor{position:absolute;inset:58% 0 0;background:linear-gradient(#9da6a3,#626b69);transform:perspective(600px) rotateX(7deg);transform-origin:top}.floor:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff1 0 2px,transparent 2px 90px),repeating-linear-gradient(0deg,#fff1 0 2px,transparent 2px 70px);opacity:.25}.island{position:absolute;left:10%;right:10%;bottom:8%;height:14%;border-radius:12px;background:linear-gradient(#566361,#263130);box-shadow:0 20px 35px #0008}.island:after{content:'VIRTUAL LAB BENCH';position:absolute;left:4%;top:25%;font-size:clamp(12px,2vw,22px);font-weight:900;letter-spacing:.2em;color:#fff2}.equip{position:absolute;z-index:4;filter:drop-shadow(0 9px 6px #0008);touch-action:none;user-select:none}.stand{left:23%;bottom:19%;width:18%;height:8%;background:#202727;border-radius:50%;transform:skewX(-7deg)}.stand:before{content:'';position:absolute;left:48%;bottom:0;width:7%;height:280%;background:#35403f}.stand:after{content:'';position:absolute;left:5%;top:45%;width:90%;height:12%;background:#7c8985}.beaker{left:45%;bottom:19%;width:8%;height:16%;border:4px solid #eaffff;border-top:0;border-radius:0 0 18px 18px;background:linear-gradient(transparent 45%,#43d5ed88 45%)}.beaker:before{content:'';position:absolute;left:-5%;top:-7%;width:110%;height:8%;border:4px solid #eaffff;border-radius:4px}.flask{left:57%;bottom:19%;width:10%;height:18%}.flask:before{content:'';position:absolute;left:39%;top:0;width:24%;height:45%;border:4px solid #eaffff;border-bottom:0;border-radius:7px}.flask:after{content:'';position:absolute;left:4%;bottom:0;width:92%;height:64%;border:4px solid #eaffff;border-radius:10px 10px 45% 45%;background:#8e75ff66}.meter{right:25%;bottom:20%;width:11%;height:16%;background:linear-gradient(#e9efed,#899390);border:2px solid #596360;border-radius:5px}.meter:after{content:'V  A  Ω';position:absolute;left:10%;right:10%;top:12%;height:28%;background:#10201d;color:#75ffb1;text-align:center;padding-top:4%;font-size:clamp(8px,1.2vw,15px)}.tray{right:10%;bottom:20%;width:19%;height:7%;background:#b9874a;border:7px solid #dfc08b;border-radius:4px}.tray:after{content:'• • • • • • • • •';position:absolute;left:12%;top:25%;color:#5b4025;letter-spacing:.5em}.tube{left:35%;bottom:20%;font-size:clamp(42px,6vw,82px)}.hand{position:absolute;right:32%;bottom:11%;font-size:clamp(65px,9vw,125px);z-index:5;opacity:.85;pointer-events:none}.hud{position:absolute;inset:0;z-index:20}.menu,.tool,.rbtn,.close{border:1px solid #fff3;background:#0d1820dd;color:#fff;border-radius:8px}.menu{position:absolute;left:10px;top:10px;width:42px;height:42px;font-size:22px}.title{position:absolute;left:62px;top:16px;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 4px #000}.title b{color:#58e8ff}.toolbar{position:absolute;left:10px;top:65px;display:grid;gap:7px}.tool{width:40px;height:40px;font-size:18px}.tool:hover,.tool.active{background:#276f84}.right{position:absolute;right:12px;top:72px;width:min(235px,31vw);display:grid;gap:6px}.rbtn{text-align:left;padding:9px 11px;font-size:13px}.rbtn:hover{background:#263944}.bottom{position:absolute;left:12px;bottom:12px;width:min(330px,72vw);background:#091823e8;border:1px solid #fff3;border-radius:9px;overflow:hidden}.padhead{background:#68b5d8;color:#06131a;padding:8px;font-size:11px;font-weight:900}.padbody{padding:10px;color:#c6dce5;font-size:12px;line-height:1.5}.modal{position:absolute;inset:0;background:#02070bcc;z-index:60;display:none;place-items:center}.modal.show{display:grid}.panel{width:min(680px,92vw);max-height:82vh;overflow:auto;background:#0b1721;border:1px solid #50e4ff66;border-radius:18px;padding:20px;box-shadow:0 30px 100px #000}.panel h2{color:#7cecff;margin-top:0}.close{float:right;padding:7px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.exp{padding:12px;text-align:left;background:#fff1;border:1px solid #fff2;border-radius:10px;color:#fff}.exp small{color:#9eb3bf}.obs{margin-top:10px;background:#03080d;border:1px solid #fff2;border-radius:10px;padding:12px;min-height:80px;color:#bfeaf4}.self{display:grid;grid-template-columns:1fr 1fr;gap:8px}.self button{padding:12px;background:#fff1;border:1px solid #fff2;border-radius:9px;color:#fff}@media(max-width:650px){.right{width:145px}.rbtn{font-size:10px;padding:7px}.title{font-size:12px}.wall:before{left:18%;font-size:17px}.wall:after{left:20%;font-size:11px}.bottom{width:245px}.cards{grid-template-columns:1fr}}</style></head><body><div class="lab" id="lab"><div class="wall"><div class="window"></div><div class="backbench"></div><div class="cab a"></div><div class="cab b"></div><div class="cab c"></div></div><div class="floor"></div><div class="island"></div><div class="equip stand" draggable="true" data-name="Retort stand"></div><div class="equip beaker" draggable="true" data-name="Beaker"></div><div class="equip flask" draggable="true" data-name="Conical flask"></div><div class="equip meter" draggable="true" data-name="Digital multimeter"></div><div class="equip tray" draggable="true" data-name="Test tube rack"></div><div class="equip tube" draggable="true" data-name="Test tube">🧪</div><div class="hand">🖐️</div><div class="hud"><button class="menu" onclick="openP('library')">☰</button><div class="title">SCIENCE<b>VERSE</b> • VIRTUAL LAB</div><div class="toolbar"><button class="tool active" onclick="openP('library')">🔬</button><button class="tool" onclick="openP('self')">🧪</button><button class="tool" onclick="openP('videos')">▶</button><button class="tool" onclick="openP('ai')">🤖</button><button class="tool" onclick="openP('report')">📝</button></div><div class="right"><button class="rbtn" onclick="openP('library')">Stages ▤</button><button class="rbtn" onclick="record()">⏺ Record</button><button class="rbtn" onclick="results()">▣ Results</button><button class="rbtn" onclick="finish()">End</button><button class="rbtn" onclick="clearR()">Clear Results</button><button class="rbtn" onclick="openP('settings')">⚙ Experiment Settings⌄</button></div><div class="bottom"><div class="padhead">LABPAD • DAY 1 • 09:05 AM <span style="float:right">PROGRESS: <b id="progress">12%</b></span></div><div class="padbody" id="pad">Interact with the equipment. Drag an item, select an experiment, then change settings and record observations.</div></div></div></div><div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeP()">✕</button><div id="content"></div></div></div><script>const ex=[['⚡','Ohm’s Law','Physics','9–12'],['🚀','Projectile Motion','Physics','11–12+'],['🌱','Photosynthesis','Biology','9–12'],['🧬','DNA Extraction','Biology','11–12'],['🧪','Acid–Base Titration','Chemistry','11–12'],['⚗️','Electrolysis','Chemistry','10–12+'],['💡','Simple Electric Circuit','Physics','6–10'],['🔬','Microscopy','Biology','6–12'],['🌡️','Calorimetry','Chemistry','11–12'],['🎨','Mixing Colours','Science','1–5'],['🫧','States of Matter','Chemistry','6–8'],['⚖️','Density','Physics','6–10']];let chosen=null,prog=12;function openP(t){let h='';if(t==='library')h='<h2>🔬 Experiment Library</h2><p>Choose an experiment and the lab scene will stay active.</p><div class="cards">'+ex.map((e,i)=>`<button class="exp" onclick="start(${i})"><b style="font-size:22px">${e[0]}</b> ${e[1]}<br><small>${e[2]} • Class ${e[3]}</small></button>`).join('')+'</div>';if(t==='self')h='<h2>🧑‍🔬 Self Experiment</h2><p>You decide the hypothesis. Change one variable at a time and observe.</p><div class="self"><button onclick="obs(\'💧 Water added\')">💧 Water</button><button onclick="obs(\'🧂 Salt added\')">🧂 Salt</button><button onclick="obs(\'🔥 Heat applied\')">🔥 Heat</button><button onclick="obs(\'⚡ Voltage changed\')">⚡ Voltage</button><button onclick="obs(\'☀️ Light changed\')">☀️ Light</button><button onclick="obs(\'🧱 Material changed\')">🧱 Material</button></div><div class="obs" id="ob">Observation panel ready.</div>';if(t==='videos')h='<h2>🎬 Experiment Videos</h2><div style="aspect-ratio:16/9;background:linear-gradient(135deg,#123246,#28204b);display:grid;place-items:center;border-radius:12px;font-size:50px">▶</div><p>Video hub for guided practicals.</p><button class="rbtn" onclick="window.open(\'https://www.youtube.com/results?search_query=virtual+science+lab+experiments\',\'_blank\')">Open video library ↗</button>';if(t==='ai')h='<h2>🤖 AI Lab Tutor</h2><input id="q" style="width:100%;padding:12px;background:#fff1;color:#fff;border:1px solid #fff2;border-radius:9px" placeholder="Why does the bulb glow?"><button class="rbtn" style="margin-top:8px" onclick="ask()">Ask AI</button><div class="obs" id="ans">I’ll explain it step-by-step.</div>';if(t==='report')h='<h2>📝 Lab Report</h2><textarea id="rp" style="width:100%;height:220px;background:#fff1;color:#fff;border:1px solid #fff2;border-radius:9px;padding:12px" placeholder="Aim → Apparatus → Procedure → Observations → Result"></textarea><button class="rbtn" onclick="save()">💾 Save report</button>';if(t==='settings')h='<h2>⚙ Experiment Settings</h2><label>Voltage <b id="v">5 V</b></label><input type="range" min="0" max="20" value="5" oninput="v.textContent=this.value+\' V\'" style="width:100%"><br><br><label>Temperature <b id="tm">25°C</b></label><input type="range" min="0" max="100" value="25" oninput="tm.textContent=this.value+\'°C\'" style="width:100%"><div class="obs">Change a variable, run the experiment and compare observations.</div>';content.innerHTML=h;modal.classList.add('show')}function closeP(){modal.classList.remove('show')}function start(i){chosen=ex[i];prog=Math.min(100,prog+4);progress.textContent=prog+'%';pad.innerHTML='<b>'+chosen[0]+' '+chosen[1]+'</b><br>'+chosen[2]+' • Class '+chosen[3]+'<br>Drag equipment, change settings, then record your observation.';closeP()}function obs(x){document.getElementById('ob').textContent=x+'. Now change another variable and compare the result.'}function record(){pad.innerHTML='<b>🔴 Observation recorded</b><br>Time: '+new Date().toLocaleTimeString()}function results(){openP('report');rp.value='Experiment: '+(chosen?chosen[1]:'My experiment')+'\nObservations:\nResult:\nPrecautions:'}function clearR(){pad.textContent='Results cleared. Ready for a new observation.'}function finish(){prog=100;progress.textContent='100%';pad.innerHTML='<b>Experiment complete 🎉</b><br>Open Results to write your conclusion.'}function ask(){let q=document.getElementById('q').value.toLowerCase();ans.textContent=/bulb|circuit/.test(q)?'A closed circuit lets current flow through the bulb, converting electrical energy into light and heat.':'Think about particles, energy and variables. Tell me your class and experiment for a more specific explanation.'}function save(){localStorage.setItem('scienceverse-report',rp.value);alert('Lab report saved ✓')}let drag=null;document.querySelectorAll('.equip').forEach(x=>{x.addEventListener('dragstart',()=>drag=x)});lab.addEventListener('dragover',e=>e.preventDefault());lab.addEventListener('drop',e=>{if(!drag)return;let r=lab.getBoundingClientRect();drag.style.left=(e.clientX-r.left)/r.width*100+'%';drag.style.top=(e.clientY-r.top)/r.height*100+'%';drag.style.bottom='auto';pad.innerHTML='<b>Moved:</b> '+drag.dataset.name+'<br>Equipment placed. Continue your experiment.'});</script></body></html>
