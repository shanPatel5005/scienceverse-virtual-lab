<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ScienceVerse 3D Virtual Laboratory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}#app{width:100%;height:100%;position:relative}canvas{display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:10px;pointer-events:auto}.brand{padding:10px 14px;border:1px solid #ffffff22;background:#07101bcc;backdrop-filter:blur(12px);border-radius:14px;font-weight:900;letter-spacing:.3px;box-shadow:0 8px 30px #0007}.brand span{color:#55e6ff}.pill{margin-left:auto;padding:9px 13px;border:1px solid #ffffff22;background:#07101bcc;border-radius:12px;color:#cce8f5;font-size:12px}.panel{position:absolute;pointer-events:auto;background:#07101ddd;border:1px solid #ffffff20;backdrop-filter:blur(16px);box-shadow:0 15px 45px #0008;border-radius:15px}.left{left:14px;top:74px;width:190px;padding:10px}.right{right:14px;top:74px;width:205px;padding:10px}.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#8ea8bb;margin:4px 7px 9px}.btn{width:100%;border:1px solid #ffffff1c;background:#ffffff09;color:#eaf9ff;padding:10px;border-radius:10px;text-align:left;margin:4px 0;cursor:pointer}.btn:hover{background:#55e6ff18;border-color:#55e6ff55}.btn.active{background:#55e6ff20;border-color:#55e6ff88}.cyan{color:#55e6ff}.bottom{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:end;gap:10px;pointer-events:none}.labpad{width:310px;padding:12px;background:#07101ddd;border:1px solid #ffffff20;border-radius:14px;backdrop-filter:blur(16px)}.labpad .head{display:flex;justify-content:space-between;color:#8ea8bb;font-size:11px}.progress{height:5px;background:#ffffff10;border-radius:99px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;width:24%;background:linear-gradient(90deg,#55e6ff,#8b7cff)}.hint{font-size:12px;color:#c5d7e1;line-height:1.4;margin-top:8px}.controls{margin-left:auto;display:flex;gap:7px;pointer-events:auto}.round{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff25;background:#07101ddd;color:#fff;cursor:pointer;font-size:17px}.round:hover{border-color:#55e6ff88}.results{font-size:12px;color:#bdd0dc;line-height:1.5;padding:8px;border-radius:9px;background:#0005;margin-top:7px;min-height:48px}.select{width:100%;background:#0b1724;color:#fff;border:1px solid #ffffff20;border-radius:9px;padding:9px;margin-bottom:5px}.tag{display:inline-block;font-size:10px;color:#75efff;background:#55e6ff12;border:1px solid #55e6ff30;padding:4px 7px;border-radius:99px;margin-bottom:6px}.hidden{display:none!important}@media(max-width:700px){.left{width:150px;left:8px;top:68px}.right{width:165px;right:8px;top:68px}.panel h3{font-size:10px}.btn{font-size:11px;padding:8px}.labpad{width:245px}.brand{font-size:13px}.pill{font-size:10px}.bottom{left:8px;right:8px;bottom:8px}.hint{font-size:10px}.controls{gap:4px}.round{width:38px;height:38px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="top"><div class="brand">🧪 Science<span>Verse</span> <small>3D LAB</small></div><div class="pill">🟢 WebGL • Interactive</div></div>
  <aside class="panel left"><h3>Laboratory</h3><button class="btn active" data-mode="explore">🔬 Explore Lab</button><button class="btn" data-mode="physics">⚡ Physics Bench</button><button class="btn" data-mode="chemistry">🧪 Chemistry Bench</button><button class="btn" data-mode="biology">🧬 Biology Bench</button><button class="btn" data-mode="molecules">⚛️ Molecule Station</button><h3 style="margin-top:14px">Equipment</h3><button class="btn" onclick="spawn('beaker')">🥛 Beaker</button><button class="btn" onclick="spawn('flask')">⚗️ Flask</button><button class="btn" onclick="spawn('microscope')">🔬 Microscope</button><button class="btn" onclick="spawn('battery')">🔋 Battery</button><button class="btn" onclick="spawn('lamp')">💡 Lamp</button></aside>
  <aside class="panel right"><h3>Experiment</h3><select class="select" id="classSel"><option>Class 1–5</option><option>Class 6–8</option><option>Class 9–10</option><option>Class 11–12</option><option>Class 12+</option></select><select class="select" id="subjectSel"><option>Physics</option><option>Chemistry</option><option>Biology</option></select><button class="btn" onclick="runExperiment()">▶ Run Experiment</button><button class="btn" onclick="resetScene()">↺ Reset Lab</button><button class="btn" onclick="toggleInfo()">☷ Stages & Results</button><div id="results" class="results">Select a bench and interact with the 3D equipment.</div><h3 style="margin-top:13px">Camera</h3><button class="btn" onclick="frontView()">🎥 Front View</button><button class="btn" onclick="topView()">⬆️ Top View</button></aside>
  <div class="bottom"><div class="labpad"><div class="head"><b>LABPAD</b><span>DAY 1 • 09:12 AM</span></div><div class="progress"><i id="prog"></i></div><div class="hint" id="hint">Drag equipment with your finger/mouse. Rotate the laboratory by dragging the empty space. Scroll/pinch to zoom.</div></div><div class="controls"><button class="round" onclick="togglePanels()">☰</button><button class="round" onclick="toggleFullscreen()">⛶</button></div></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {DragControls} from 'three/addons/controls/DragControls.js';

const app=document.getElementById('app');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x09111a);scene.fog=new THREE.Fog(0x09111a,18,42);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(11,7.5,14);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;app.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,2,0);orbit.enableDamping=true;orbit.dampingFactor=.06;orbit.minDistance=6;orbit.maxDistance=25;orbit.maxPolarAngle=Math.PI*.48;
scene.add(new THREE.HemisphereLight(0xcfefff,0x14202b,2.2));
const key=new THREE.DirectionalLight(0xffffff,3.5);key.position.set(5,12,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const blue=new THREE.PointLight(0x48cfff,18,15);blue.position.set(0,5,2);scene.add(blue);
const purple=new THREE.PointLight(0x7b6cff,12,12);purple.position.set(-8,4,-4);scene.add(purple);
function mat(c,rough=.45,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function box(n,s,p,c,metal=0){let m=new THREE.Mesh(new THREE.BoxGeometry(...s),mat(c,.38,metal));m.name=n;m.position.set(...p);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function cyl(n,r,h,p,c,seg=32){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat(c,.3,.15));m.name=n;m.position.set(...p);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function glass(n,r,h,p,liquid=0x4adfff){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,32,1,true),new THREE.MeshPhysicalMaterial({color:0xdff9ff,transparent:true,opacity:.23,roughness:.08,transmission:.25,side:THREE.DoubleSide}));m.name=n;m.position.set(...p);m.castShadow=true;scene.add(m);let l=cyl(n+' liquid',r*.82,h*.38,[p[0],p[1]-h*.28,p[2]],liquid);return [m,l]}
// room
box('floor',[24,.35,20],[0,-.2,0],0x3a4650,0);box('backwall',[24,12,.35],[0,5,-8],0x18252f);box('leftwall',[.35,12,20],[-12,5,0],0x111b23);box('ceiling',[24,.25,20],[0,11,0],0x0e171e);
// floor grid
for(let x=-11;x<=11;x+=1){let g=box('floorline',[.015,.01,19],[x,-.015,0],0x53616a);g.castShadow=false}for(let z=-9;z<=9;z+=1){let g=box('floorline',[23,.01,.015],[0,-.014,z],0x53616a);g.castShadow=false}
// windows / futuristic wall panels
for(let x=-8;x<=8;x+=4){box('window',[3.4,3,.12],[x,6.5,-7.78],0x163c54);box('window glow',[3.0,2.6,.03],[x,6.5,-7.7],0x5bdcff);}
// central benches
function bench(z=0){box('bench top',[20,.45,2.4],[0,2.15,z],0xd9dde0,0);box('bench frame',[18,.35,1.8],[0,1.75,z],0x26343d,1);for(let x=-8;x<=8;x+=4)box('bench leg',[.25,2,.25],[x,1,z],0x1d252c,1);}
bench(-.8);bench(5.2);
// cabinets
for(let x=-10;x<=10;x+=2.5){box('cabinet',[2.1,2,.9],[x,1.1,-6.4],0xe3e7e9);box('drawer',[1.8,.5,.08],[x,1.4,-5.92],0x60717c,1)}
// lab equipment on main bench
const draggables=[];
function addDrag(o){o.userData.draggable=true;draggables.push(o);return o}
// beakers/flasks
for(let i=0;i<4;i++){let x=-7+i*2.2;let [g,l]=glass('beaker '+i,.48,1.25,[x,3.0,-.8],i%2?0x65e5ff:0x55aaff);addDrag(g);addDrag(l)}
function flask(x,z){let group=new THREE.Group();group.name='Erlenmeyer Flask';let body=new THREE.Mesh(new THREE.CylinderGeometry(.65,.9,1.1,32),new THREE.MeshPhysicalMaterial({color:0xdff9ff,transparent:true,opacity:.25,transmission:.2}));body.position.y=.55;group.add(body);let neck=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.9,24),new THREE.MeshPhysicalMaterial({color:0xdff9ff,transparent:true,opacity:.3}));neck.position.y=1.45;group.add(neck);let li=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.3,24),mat(0x9d6cff,.2));li.position.y=.22;group.add(li);group.position.set(x,2.35,z);group.traverse(q=>{if(q.isMesh){q.castShadow=true;q.userData.draggable=true}});scene.add(group);draggables.push(group);return group}
flask(3,-.8);flask(5,-.8);
// microscope
function microscope(x,z){let g=new THREE.Group();g.name='Microscope';g.add(new THREE.Mesh(new THREE.BoxGeometry(2,.18,1.2),mat(0x151d24,.25,1)));let base=g.children[0];base.position.y=.1;let arm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2.1,20),mat(0x3b4650,.25,1));arm.position.set(-.55,1.1,0);arm.rotation.z=-.18;g.add(arm);let stage=new THREE.Mesh(new THREE.BoxGeometry(1.1,.12,.8),mat(0x2d3b44,.3,1));stage.position.set(.15,1.15,0);g.add(stage);let tube=new THREE.Mesh(new THREE.CylinderGeometry(.22,.16,1.5,20),mat(0x151d24,.2,1));tube.position.set(.55,1.9,0);tube.rotation.z=-.15;g.add(tube);g.position.set(x,2.4,z);g.traverse(q=>{if(q.isMesh){q.castShadow=true;q.userData.draggable=true}});scene.add(g);draggables.push(g)}
microscope(7,-.8);
// physics track
box('track',[9,.18,.65],[-1.5,2.65,4.8],0x171d24,1);for(let x=-5.5;x<=2.5;x+=.8)box('trackmark',[.02,.03,.65],[x,2.77,4.8],0x7a8b95);let cart=box('physics cart',[1.2,.45,.8],[-3,3.05,4.8],0x3d5668,1);addDrag(cart);cyl('cart wheel1',.22,.12,[-3.35,2.75,4.45],0x11161b);cyl('cart wheel2',.22,.12,[-2.65,2.75,4.45],0x11161b);
// power supply, wires, lamp
box('power supply',[1.8,.8,1.2],[1.2,2.95,4.5],0x303a43,1);box('display',[1.2,.32,.05],[1.2,3.3,3.87],0x08141c);addDrag(scene.getObjectByName('power supply'));
const lamp=cyl('lamp',.45,.8,[4.2,3.1,4.7],0xffb52e);addDrag(lamp);cyl('lamp stand',.08,1.2,[4.2,2.45,4.7],0x28343d);
// biology station
box('bio tray',[5,.18,2],[-5,2.65,-5.3],0x22323a,1);for(let x=-6.5;x<=-3.5;x+=1){let [g,l]=glass('culture tube',.25,1.3,[x,3.35,-5.3],0x63e6a5);addDrag(g);addDrag(l)}
// molecule station: atom spheres + bonds
function molecule(){let group=new THREE.Group();group.name='Molecule Model';let pts=[[0,4.2,1.8],[-1.1,4.7,1.8],[1.1,4.7,1.8],[0,3.25,1.8]];let cols=[0x333333,0xff4444,0xff4444,0x333333];pts.forEach((p,i)=>{let s=new THREE.Mesh(new THREE.SphereGeometry(.42,32,20),mat(cols[i],.2,.1));s.position.set(...p);s.castShadow=true;group.add(s)});[[0,1],[0,2],[0,3]].forEach(([a,b])=>{let A=new THREE.Vector3(...pts[a]),B=new THREE.Vector3(...pts[b]),d=B.clone().sub(A);let q=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,d.length,16),mat(0x9aa6ad,.3,1));q.position.copy(A.clone().add(B).multiplyScalar(.5));q.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());q.castShadow=true;group.add(q)});scene.add(group);draggables.push(group)}molecule();
// wall screens
box('screen',[6,2.8,.15],[5.3,6.2,-7.55],0x071219,1);box('screen glow',[5.5,2.3,.03],[5.3,6.2,-7.45],0x12445b);box('screen line',[4.6,.08,.04],[5.3,6.6,-7.38],0x55e6ff);
// 3D label signs
function sign(text,pos){let c=document.createElement('canvas');c.width=512;c.height=128;let x=c.getContext('2d');x.fillStyle='#07131c';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#55e6ff';x.lineWidth=4;x.strokeRect(4,4,c.width-8,c.height-8);x.font='bold 42px sans-serif';x.fillStyle='#bff6ff';x.textAlign='center';x.fillText(text,256,78);let t=new THREE.CanvasTexture(c);let m=new THREE.Mesh(new THREE.PlaneGeometry(4,1),new THREE.MeshBasicMaterial({map:t,transparent:true}));m.position.set(...pos);scene.add(m)}
sign('PHYSICS',[-7,5.8,-7.5]);sign('CHEMISTRY',[0,5.8,-7.5]);sign('BIOLOGY',[7,5.8,-7.5]);
let drag=new DragControls(draggables,camera,renderer.domElement);drag.addEventListener('dragstart',e=>{orbit.enabled=false;e.object.userData.oldY=e.object.position.y;e.object.position.y=Math.max(e.object.position.y,.5);hint.textContent='Release the equipment to place it on the bench.'});drag.addEventListener('dragend',e=>{orbit.enabled=true;progress(35,'Equipment placed. Now run the experiment.')});
const hint=document.getElementById('hint');
function progress(v,msg){document.getElementById('prog').style.width=v+'%';hint.textContent=msg}
window.spawn=function(type){let o;if(type==='beaker')[o]=glass('new beaker',.5,1.3,[0,3,0],0x55ddff);else if(type==='flask')o=flask(0,0);else if(type==='microscope')microscope(0,0);else if(type==='battery'){o=box('Battery',[1.4,.6,.8],[0,3,0],0x8a2e42,1)}else{o=box('Lamp',[.8,.8,.8],[0,3,0],0xffc42e,1)};progress(18,'New equipment added. Drag it anywhere on the bench.')}
window.runExperiment=function(){let s=document.getElementById('subjectSel').value;let c=document.getElementById('classSel').value;let r=document.getElementById('results');r.innerHTML=s==='Physics'?'<b class="cyan">Physics simulation ready.</b><br>Change the cart position, inspect the track and observe motion.':s==='Chemistry'?'<b class="cyan">Chemistry simulation ready.</b><br>Combine virtual solutions and adjust conditions to explore observations.':'<b class="cyan">Biology simulation ready.</b><br>Inspect the culture tubes and molecule station. Next: add guided protocols.';progress(62,c+' • '+s+' experiment started.')}
window.resetScene=function(){location.reload()};window.toggleInfo=function(){document.querySelector('.right').classList.toggle('hidden')};window.togglePanels=function(){document.querySelector('.left').classList.toggle('hidden');document.querySelector('.right').classList.toggle('hidden')};window.toggleFullscreen=function(){document.documentElement.requestFullscreen?.()};window.frontView=function(){camera.position.set(11,6,15);orbit.target.set(0,2.5,0);orbit.update()};window.topView=function(){camera.position.set(0,17,.5);orbit.target.set(0,0,0);orbit.update()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let m=b.dataset.mode;if(m==='physics'){orbit.target.set(-1,3,4);camera.position.set(10,6,12);progress(30,'Physics bench selected. Try moving the cart.')}else if(m==='chemistry'){orbit.target.set(0,3,-1);progress(30,'Chemistry bench selected. Try moving glassware.')}else if(m==='biology'){orbit.target.set(-5,3,-4);progress(30,'Biology station selected. Inspect the culture tubes.')}else if(m==='molecules'){orbit.target.set(0,4,1);progress(30,'Molecule station selected. Rotate around the 3D structure.')}else{orbit.target.set(0,2,0);progress(24,'Explore the whole laboratory.')}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
function animate(){requestAnimationFrame(animate);orbit.update();let t=performance.now()*.001;blue.intensity=16+Math.sin(t*1.5)*3;renderer.render(scene,camera)}animate();
</script>
</body></html>
