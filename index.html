<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07131c"><meta name="description" content="ScienceVerse — an interactive 3D science simulator."><link rel="manifest" href="./manifest.webmanifest"><title>ScienceVerse • 3D Science Simulator</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#061018}body{font-family:Inter,system-ui,sans-serif;color:#eefaff}#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#173b50,#061018 62%)}#boot .box{width:min(390px,88vw);padding:24px;border:1px solid #ffffff1f;border-radius:22px;background:#071722ed;text-align:center;box-shadow:0 20px 60px #000b}.spinner{width:42px;height:42px;border:3px solid #ffffff18;border-top-color:#55e5ff;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}@keyframes r{to{transform:rotate(360deg)}}#fallback{display:none;position:fixed;inset:0;z-index:100;place-items:center;background:#061018;padding:20px;text-align:center}.muted{color:#a7bbc5;font-size:12px;line-height:1.5}button{cursor:pointer}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","./style.css":"data:text/javascript,export default {}"}}</script></head><body><div id="app"></div><div id="boot"><div class="box"><div class="spinner"></div><h2>🧪 ScienceVerse</h2><div class="muted">Starting 3D laboratory…</div></div></div><div id="fallback"></div><script type="module">window.addEventListener('error',e=>{const f=document.querySelector('#fallback');if(f&&!f.innerHTML){document.querySelector('#boot')?.remove();f.style.display='grid';f.innerHTML='<div><h2>⚠️ ScienceVerse startup error</h2><p class="muted">The 3D engine could not start.</p><button onclick="location.reload()">Retry</button></div>';}});import('./src/stable.js').catch(e=>{console.error(e);const b=document.querySelector('#boot');b?.remove();const f=document.querySelector('#fallback');f.style.display='grid';f.innerHTML='<div><h2>⚠️ ScienceVerse startup error</h2><p class="muted">3D module failed to load.</p><p class="muted">'+String(e?.message||'Unknown module error').replace(/[<>]/g,'')+'</p><button onclick="location.reload()">Retry</button></div>';});</script></body></html>
