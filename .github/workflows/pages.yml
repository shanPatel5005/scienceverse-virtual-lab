name: Deploy ScienceVerse Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build:web
      - name: Copy public runtime files
        run: cp manifest.webmanifest icon.svg sw.js dist/ 2>/dev/null || true
      - name: Validate build output
        run: test -f dist/index.html && test -s dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish ScienceVerse
        id: deployment
        uses: actions/deploy-pages@v4
